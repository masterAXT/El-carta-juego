<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Cards - Personajes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 15px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: clamp(1.8em, 5vw, 3em);
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: clamp(0.9em, 2.5vw, 1.1em);
        }

        .controls {
            max-width: 1400px;
            margin: 0 auto 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .lang-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .lang-btn,
        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #4ecdc4;
            background: transparent;
            color: #4ecdc4;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: clamp(0.85em, 2vw, 1em);
            white-space: nowrap;
        }

        .filter-btn {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .lang-btn.active {
            background: #4ecdc4;
            color: #1a1a2e;
        }

        .filter-btn.active {
            background: #ff6b6b;
            color: #1a1a2e;
        }

        .lang-btn:hover,
        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 205, 196, 0.3);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: 1fr;
                max-width: 500px;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #4ecdc4;
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.3);
        }

        .card-image {
            width: 100%;
            height: 399px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            background-size: cover;
            background-position: center;
        }

        @media (max-width: 768px) {
            .card-image {
                height: 450px;
            }
        }

        .card-title {
            font-size: clamp(1.2em, 3vw, 1.5em);
            margin-bottom: 8px;
            color: #4ecdc4;
        }

        .card-type {
            font-size: clamp(0.8em, 2vw, 0.9em);
            color: #ff6b6b;
            margin-bottom: 5px;
        }

        .card-rarity {
            font-size: clamp(0.75em, 2vw, 0.85em);
            color: #ffd93d;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            overflow-y: auto;
            padding: 15px;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            padding: 30px 20px;
            position: relative;
            border: 2px solid #4ecdc4;
            max-height: 90vh;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .modal-content {
                padding: 25px 15px;
                margin: 10px;
            }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.8em;
            cursor: pointer;
            color: #ff6b6b;
            transition: transform 0.3s;
            z-index: 10;
        }

        .close-btn:hover {
            transform: rotate(90deg);
        }

        .modal-header {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(78, 205, 196, 0.3);
        }

        .modal-title {
            font-size: clamp(1.5em, 4vw, 2.5em);
            color: #4ecdc4;
            margin-bottom: 10px;
            padding-right: 30px;
        }

        .modal-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .meta-item {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: clamp(0.75em, 2vw, 0.9em);
        }

        .modal-body {
            line-height: 1.8;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: clamp(1.1em, 2.5vw, 1.3em);
            color: #ffd93d;
            margin-bottom: 10px;
            padding-left: 15px;
            border-left: 4px solid #ffd93d;
        }

        .section-content {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            white-space: pre-wrap;
            font-size: clamp(0.9em, 2vw, 1em);
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #4ecdc4;
            font-size: clamp(1.1em, 3vw, 1.3em);
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🎮 SERVER CARDS 🎮</h1>
        <p>Oficial Wiki by AdriXT_</p>
    </div>

    <div class="controls">
        <div class="lang-toggle">
            <button class="lang-btn active" onclick="setLanguage('es')">Español</button>

        </div>

        <div class="filter-buttons" id="filterButtons">

            <button class="filter-btn" onclick="setFilter('fantasy')" data-filter="fantasy"></button>

            <button class="filter-btn" onclick="setFilter('neutral')" data-filter="neutral"></button>

    <div class="cards-grid" id="cardsGrid"></div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>

                <div class="modal-meta" id="modalMeta"></div>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

        const cards = [
            {

                    passive: 'El puto Loco no está sujeto a las normas estándar del servidor. Sus acciones no pueden usarse como prueba directa en juicios o acusaciones formales. Puede interferir indirectamente en eventos clave sin declarar intención.',

                    note: 'Se dice que el Loco oye una canción que nadie más percibe. A veces un arpa o laúd antiguo que toca una etérea melodía. A veces un sonido electrónico y zumbidos mecánicos. Quienes lo han observado por mucho, aseguran que no improvisa… Solo interpreta la partitura de la misteriosa música que escucha.'
                },
                en: {

                    rarity: 'Special Wildcard - Unique',
                    persistence: 'Permanent',
                    alignment: 'Whoever talks to him nicely… or feeds him',
                    description: 'The Fool belongs to no faction. He does not seek to win. He does not seek to lose. He is something that simply happens, without peace, negotiation, or reason. When the Fool acts, the world does not break; it goes out of tune.',

            },
            {

                    description: 'No maldice a las personas: les cobra deudas que aún no saben que tienen. El Ritualista opera en los márgenes del mundo, allí donde los nombres verdaderos importan, la sangre recuerda y los objetos conservan la voluntad de quienes los empuñaron. Su magia no es impulsiva ni caótica; es antigua, precisa y paciente.',

                    passive: 'The Ritualist can perform exclusive dark rituals inaccessible to other roles. His knowledge does not come from common books, but from memories etched in blood and essence. He is capable of manipulating life energy, ancient relics, and forgotten remains. The more personal the object offered, the deeper, more dangerous, and more powerful the ritual becomes.',
                    active: 'With proper preparation, the Veil Ritualist can alter the course of others: cursing an individual, weakening them, marking them, or twisting their fate in ways that are not always immediate. He employs magic as well as the summoning of entities of a dark nature. Every ritual demands a price: objects that once belonged to the target, rare materials obtained through real risk, and an agreed payment.',

            {

                    description: 'Comercia con lo que otros fingen que no existe. El mercader negro opera en los límites oscuros del mercado negro. Donde no llegan las normas, donde la legalidad se vuelve difusa y el precio deja de medirse solo en monedas… No vende ni comida ni herramientas comunes. Vende accesos, atajos, prohibiciones y adicciones, y cosas que no deberían cambiar de manos.',
                    passive: 'Puede comerciar con objetos de dudosa legalidad y moralidad. Puede alterar indirectamente los precios del mercado mediante escasez, superávit, acaparamiento o información selectiva. Tiene acceso a tratos que no pueden hacerse públicamente… Mientras exista ese tipo de necesidades… ahí estará su negocio.',
                    active: 'Puede conceder préstamos con condiciones tanto narrativas como de gameplay. Exigir garantías (mascotas, objetos personales, favores futuros, cláusulas ambiguas). Si un trato se incumple: puede recurrir al ritualista con tu objeto de valor. Puede solicitar mediación o ejecución parcial al árbitro. Sus consecuencias no siempre serán inmediatas.',
                    note: 'El mercader negro nunca fuerza un trato, siempre ofrece una salida, el problema es que, cuando miras atrás, descubres que ya habías aceptado.'
                },
                en: {
                    title: 'THE BLACK MERCHANT',
                    type: 'Faction Role - Fantasy',
                    rarity: 'Unique',
                    persistence: 'Permanent',
                    alignment: 'Self-Interest / Manipulation',
                    description: 'He trades in what others pretend does not exist. The Black Merchant operates on the shadowed edges of the black market. Where rules do not reach, where legality blurs, and where price is no longer measured solely in coin… He does not sell food or common tools. He sells access, shortcuts, prohibitions, addictions, and things that should never change hands.',

                }
            },
            {
                id: 'archaeologist',
                icon: '🦖',
                image: 'ELArqueologo.png',
                faction: 'scifi',
                es: {
                    title: 'EL ARQUEÓLOGO',
                    type: 'Rol de bando - Ciencia ficción',
                    rarity: 'Única',
                    persistence: 'Permanente',
                    alignment: 'Conocimiento',
                    description: 'No busca el pasado, solo escucha lo que aún no ha terminado de decir. El arqueólogo no conquista ni defiende, excava. Mientras que los otros de su bando miran mucho hacia el futuro, él hurga con cuidado en el pasado, porque sabe que todo progreso deja huellas. Su labor es dar sentido a las reliquias y restos que encuentra.',

                    active: 'LIMITACIÓN - Cuando el Ancianito pica, los bloques de minerales NO sueltan objetos. Puede romperlos, sí. Aprovecharlos… no.\n\nDEBILIDAD - Tiene 3 corazones máximos. Cualquier caída mal calculada es una sentencia. El combate directo es una idea pésima.\n\nMALDICIÓN - Bajo el agua, sus pulmones negros se vacían con velocidad alarmante. Nunca le enseñaron a nadar y fumaba como una carretilla.',
                    note: 'Es un detector ambulante de riqueza. Una biblioteca viviente de "dónde". Un estorbo absoluto para el "cómo". Todos lo quieren cerca. Nadie quiere que actúe. Un recordatorio de que la flor de la vida pasa y de que, en algún momento, todos seremos una ramita seca.'
                },
                en: {
                    title: 'THE LITTLE OLD MAN',
                    type: 'Faction Role - Fantasy',
                    rarity: 'Unique',

                    alignment: 'Useless Wisdom / Tragic Comedy / Formerly Useful',
                    description: 'He knows where everything is… but he can\'t do anything about it anymore. There was a time when he was a miner. In his younger years, the Little Old Man touched something he should not have: a fragment of the Overworld Core, a relic that connects all layers of the world. He did not explode. He did not ascend. He aged badly. Since then, he sees the world as it truly is on the inside, but his hands no longer obey, and his bones protest at the mere act of existing.',
                    passive: 'The Little Old Man knows exactly where valuable minerals, hidden chests, spawners, and ancient structures are located. But knowing is not the same as being able. He greatly enjoys bathing in warm waters with older ladies; he has a surprising tolerance for fire and lava. He has calluses everywhere and can withstand superficial blows. He mines very fast, although…',
                    active: 'LIMITATION - When the Little Old Man mines, mineral blocks do NOT drop items. He can break them, yes. Make use of them… no.\n\nWEAKNESS - Maximum of 3 hearts. Any miscalculated fall is a death sentence. Direct combat is a terrible idea.\n\nCURSE - Underwater, his blackened lungs empty at an alarming speed. He was never taught to swim and smoked like a chimney.',

            {

                    description: 'El Glitch no fue diseñado para esto. Fue creado para cumplir una función clara, estable, eficiente. Pero algo falló. Mientras otros sistemas se degradan y colapsan, esta máquina se vuelve peligrosa cuanto peor salen las cosas. No porque mejore, sino porque pierde restricciones. En perfecto estado es predecible. En mal estado… es otra cosa.',
                    passive: 'Mientras El Glitch se mantiene por encima de su estado crítico, su capacidad de combate es limitada. No destaca en fuerza, resistencia ni control. Es estable, controlable y relativamente inofensivo. El sistema funciona como debería, y eso lo contiene. \n\nEfecto Reactivo (Fallo Crítico) Cuando El Glitch desciende por debajo de su umbral de integridad: Aumenta significativamente su daño. Mejora su agresividad y presión en combate perdiendo protocolo. Se vuelve más impredecible. Cuanto más deteriorado esté el sistema, más violentas se vuelven las anomalías, el glitch se libera de sus límites. \n\nEl Glitch no puede desactivar voluntariamente su estado de fallo. No controla cuándo ocurre, se le puede ir en contra el fallar demasiado. No decide cuánto dura. Intentar “arreglarlo” demasiado puede devolverlo a un estado débil.',
                    active: 'Sin efecto activo',
                    note: 'Algunos ingenieros dicen que no es un error, sino una función mal documentada. Otros aseguran que la máquina aprendió que solo al borde del colapso se le permite ser algo más que una herramienta. Unos lo verán como un arma defectuosa, otros como un riesgo incontrolable.'
                },
                en: {
                    title: 'THE GLITCH',
                    type: 'Faction Role - Science Fiction',
                    rarity: 'Unique',
                    persistence: 'Permanent',
                    alignment: 'Functional Chaos / Entropy',
                    description: 'The Glitch was not designed for this. It was created to fulfill a clear, stable, efficient function. But something failed. While other systems degrade and collapse, this machine becomes more dangerous the worse things go. Not because it improves, but because it loses its restrictions. At full integrity, it is predictable. In poor condition… it is something else.',
                    passive: 'While the Glitch remains above its critical state, its combat capability is limited. It does not excel in strength, endurance, or control. It is stable, manageable, and relatively harmless. The system functions as intended, and that is what restrains it. \n\nReactive Effect (Critical Failure): When the Glitch drops below its integrity threshold: Its damage increases significantly. Its aggression and combat pressure improve as protocols are lost. It becomes increasingly unpredictable. The more deteriorated the system becomes, the more violent the anomalies grow, the Glitch frees itself from its limits. \n\nThe Glitch cannot voluntarily disable its failure state. It does not control when it happens. Failing too much can turn against it. It does not decide how long it lasts. Attempting to “fix” it too thoroughly may return it to a weakened state.',
                    active: 'No active effect',
                    note: 'Some engineers claim it is not a bug, but a poorly documented feature. Others insist the machine learned that only at the edge of collapse is it allowed to be more than a tool. Some will see it as a defective weapon, others as an uncontrollable risk.'
                },
            },
            {
                id: 'judge_of_the_cycle',
                icon: '⚖️',
                image: 'ElJuezDelCiclo.jpeg',
                faction: 'scifi',
                es: {
                    title: 'EL JUEZ DEL CICLO',
                    type: 'Rol de Bando - Ciencia Ficción',
                    rarity: 'Única',
                    persistence: 'Permanente',
                    alignment: 'Orden / Interpretación',
                    description: 'El Juez no representa la justicia absoluta ni la moral universal. Representa el sistema. En un mundo donde la magia y la tecnología disputan el significado de la verdad, actúa como intérprete del contrato social: observa actos, escucha versiones, analiza precedentes y decide qué encaja… y qué debe ser corregido. Es respetado, cuestionado y temido. No gobierna solo, pero sin él, el orden se fragmenta. Su autoridad no es divina: depende del reconocimiento social y de la memoria de sus sentencias.',
                    passive: 'Posee un valor narrativo y social llamado Dharma Judicial, que refleja su deber, prestigio y legitimidad percibida. Un Dharma positivo refuerza su autoridad; uno negativo la debilita. El Dharma lo determina la reacción del mundo a sus fallos. Además, registra actos y precedentes de cada individuo, generando Karma Judicial. A mayor Karma negativo de un individuo, el Juez inflige más daño contra él y recibe menos daño de sus ataques. El Karma es memoria convertida en consecuencia.',
                    active: 'Puede abrir juicios públicos, proponer sentencias que se votan junto al Senado e interpretar la ley mediante decretos temporales. Su voto tiene mayor peso que el estándar y el Senado actúa como contrapeso. Cuando un individuo alcanza el máximo Karma Judicial negativo, puede dictar Sentencia de Exilio: la carta del acusado queda inactiva, pierde influencia legal y sufre retribución extrema frente al Juez. El Exilio no es muerte: es desaparición del significado. El Árbitro puede revisar esta sentencia.',
                    note: 'Dicen que el Juez no castiga: deja que el mundo recuerde. Cada fallo deja una huella y cada precedente inclina el ciclo.'
                },
                en: {
                    title: 'THE JUDGE OF THE CYCLE',
                    type: 'Faction Role - Science Fiction',
                    rarity: 'Unique',
                    persistence: 'Permanent',
                    alignment: 'Order / Interpretation',
                    description: 'The Judge does not represent absolute justice nor universal morality. He represents the system. In a world where magic and technology compete over truth, he interprets the social contract: observing actions, hearing testimonies, analyzing precedents, and deciding what fits and what must be corrected. Respected, questioned, and feared, he does not rule alone, but without him order fragments. His authority is not divine; it depends on social recognition and the memory of his rulings.',
                    passive: 'He possesses a narrative and social value known as Judicial Dharma, reflecting duty, prestige, and perceived legitimacy. Positive Dharma strengthens his authority; negative Dharma weakens it. Dharma is determined by the world’s reaction to his rulings. He also records actions and precedents, generating Judicial Karma. The higher an individual’s negative Karma, the more damage the Judge deals to them and the less he receives from their attacks. Karma is memory turned into consequence.',
                    active: 'He may open public trials, propose sentences voted alongside the Senate, and interpret the law through temporary decrees. His vote carries greater weight, with the Senate as counterbalance. When an individual reaches maximum negative Judicial Karma, he may issue a Sentence of Exile: the accused’s card becomes inactive, loses legal influence, and suffers extreme retribution when facing the Judge. Exile is not death: it is the disappearance of meaning. The Arbiter may review this sentence.',
                    note: 'They say the Judge does not punish; he allows the world to remember. Every ruling leaves a mark and every precedent tilts the cycle.'
                }
            },
            {
                id: 'the_arbiter',
                icon: '👁️',
                image: 'ElArbitro.jpeg',
                faction: 'neutral',
                es: {
                    title: 'EL ÁRBITRO',
                    type: 'Rol de Bando - Neutral',
                    rarity: 'Comodín - Única',
                    persistence: 'Permanente',
                    alignment: 'Equilibrio / Observador',
                    description: 'El Árbitro no pertenece a ningún bando ni responde a intereses internos. No compite, no conspira, no gobierna: observa. Conoce el origen del sistema, la intención de las reglas y el sentido de la historia. Interviene solo cuando el equilibrio se rompe o la narrativa amenaza con destruirse.',
                    passive: 'Su mera existencia disuade excesos: ningún poder es absoluto y ninguna carta está por encima del sistema. Las decisiones extremas saben que serán observadas. Además, conoce el propósito de cada carta, la intención de cada mecánica y el equilibrio narrativo, pudiendo interpretar las reglas por su espíritu.',
                    active: 'Puede ajustar, corregir o anular decisiones que rompan el equilibrio, revisar sentencias y castigos extremos, e introducir cambios excepcionales para preservar la experiencia colectiva. Cuando un sistema entra en bucle o abuso, puede reiniciar dinámicas, redistribuir consecuencias o redefinir límites temporales.',
                    note: 'El Árbitro no aparece en las historias. Cuando todo funciona, nadie lo nombra. Cuando algo se rompe, todos lo sienten.'
                },
                en: {
                    title: 'THE ARBITER',
                    type: 'Faction Role - Neutral',
                    rarity: 'Wildcard - Unique',
                    persistence: 'Permanent',
                    alignment: 'Balance / Observer',
                    description: 'The Arbiter belongs to no faction and serves no internal interest. He does not compete, conspire, or rule: he observes. He knows the origin of the system, the intent behind the rules, and the meaning of the story, intervening only when balance breaks or the narrative risks destroying itself.',
                    passive: 'His mere existence deters excess: no power is absolute and no card stands above the system. Extreme decisions know they are being watched. He also knows the purpose of every card, the intent of every mechanic, and the narrative balance, interpreting rules by their spirit.',
                    active: 'He may adjust, correct, or nullify decisions that break balance, review sentences and extreme punishments, and introduce exceptional changes to preserve the collective experience. When a system enters a loop or abuse, he may reset dynamics, redistribute consequences, or redefine temporary limits.',
                    note: 'The Arbiter does not appear in stories. When everything works, no one names him. When something breaks, everyone feels it.'
                }
            },
            {
                id: 'magnate',
                icon: '💼',
                image: 'ElMagnate.jpeg',
                faction: 'scifi',
                es: {
                    title: 'EL MAGNATE',
                    type: 'Rol de Bando - Ciencia Ficción',
                    rarity: 'Única',
                    persistence: 'Permanente',
                    alignment: 'Orden / Capital / Interés propio',
                    description: 'El Magnate no gobierna con ejércitos ni con palabras, sino con infraestructuras. Donde otros ven recursos, él ve flujos. Donde otros ven dinero, él ve poder en movimiento. Ingeniero, empresario y arquitecto del mercado, el Magnate es capaz de levantar complejos industriales a gran escala, automatizar procesos imposibles y transformar la economía del mundo en una extensión de su voluntad. No necesita convencer: basta con que el mundo dependa de lo que produce.',
                    passive: 'El poder del Magnate está directamente ligado a su actividad económica reciente. Acumular dinero por sí solo le otorga beneficios limitados. Gastar grandes cantidades de capital en infraestructuras, contratos o producción aumenta temporalmente su eficiencia, mejora su rendimiento general y refuerza su presencia como potencia económica. Cuanto mayor sea la escala de sus inversiones, mayor será el impacto de este efecto. El capital que fluye fortalece al Magnate. El capital estancado lo debilita.',
                    active: 'El Magnate puede convertir capital en poder directo, comprando de forma inmediata las mayores ventajas de su build. Además, puede declarar un ALL IN, apostando la totalidad —o casi la totalidad— de su capital acumulado. Al hacerlo, entra en un estado temporal de poder absoluto, obtiene una ventaja abrumadora en eficiencia, control o capacidad de producción, y su influencia económica y material alcanza su punto máximo. Este estado es breve y no puede mantenerse indefinidamente. Cuando el efecto termina, el Magnate queda económicamente expuesto: sin reservas, vulnerable al mercado… o dependiente de otros jugadores. Bajar precios, renegociar contratos o provocar desequilibrios es habitual tras un ALL IN. Este evento afecta a todo el servidor. El ALL IN no garantiza el éxito. Solo magnifica las consecuencias.',
                    note: 'El Magnate no cree en la suerte ni en el destino. Cree en el riesgo calculado. Ha aprendido que toda fortuna es frágil y que el verdadero poder no está en poseerlo todo, sino en saber cuándo gastarlo todo. En un mundo dividido entre ciencia y fantasía, demuestra que existe una fuerza más antigua y peligrosa que ambas: el capital cuando se desata.'
                },
                en: {
                    title: 'THE MAGNATE',
                    type: 'Faction Role - Science Fiction',
                    rarity: 'Unique',
                    persistence: 'Permanent',
                    alignment: 'Order / Capital / Self-Interest',
                    description: 'The Magnate does not rule with armies or words, but with infrastructure. Where others see resources, he sees flows. Where others see money, he sees power in motion. An engineer, entrepreneur, and architect of the market, the Magnate is capable of raising large-scale industrial complexes, automating impossible processes, and turning the world\'s economy into an extension of his will. He does not need to persuade: it is enough that the world depends on what he produces.',
                    passive: 'The Magnate\'s power is directly tied to his recent economic activity. Simply accumulating money grants limited benefits. Spending large amounts of capital on infrastructure, contracts, or production temporarily increases his efficiency, improves his overall performance, and reinforces his presence as an economic powerhouse. The greater the scale of the investment, the stronger the impact of this effect. Flowing capital strengthens the Magnate. Stagnant capital weakens him.',
                    active: 'The Magnate can convert capital directly into power, instantly purchasing the strongest advantages of his build. In addition, he may declare an ALL IN, wagering the entirety—or nearly the entirety—of his accumulated capital. By doing so, he enters a temporary state of absolute power, gains overwhelming advantages in efficiency, control, or production capacity, and his economic and material influence reaches its peak. This state is brief and cannot be sustained indefinitely. When the effect ends, the Magnate is left economically exposed: without reserves, vulnerable to the market… or dependent on other players. Price drops, renegotiations, and market disruption often follow an ALL IN. This event affects the entire server. ALL IN does not guarantee success. It only magnifies the consequences.',
                    note: 'The Magnate does not believe in luck or destiny. He believes in calculated risk. He has learned that every fortune is fragile, and that true power does not lie in owning everything, but in knowing when to spend everything. In a world divided between science and fantasy, he proves that there is a force older and more dangerous than both: capital unleashed.'
                }
            },
            {
                id: 'water_mage',
                icon: '🌊',
                image: 'MagoDeAgua.jpeg',
                faction: 'fantasy',
                es: {
                    title: 'EL MAGO DE AGUA',
                    type: 'Rol de Bando - Fantasía',
                    rarity: 'Única',
                    persistence: 'Permanente',
                    alignment: 'Hechicero elemental',
                    description: 'El Mago de Agua no domina el agua: la interpreta. Su magia no nace de la fuerza bruta ni del estudio rígido, sino de la visualización absoluta de su entorno. Para él, el mundo no es un escenario, sino un flujo constante de mareas, ciclos lunares y climas cambiantes. Donde otros ven lluvia, él ve oportunidad; donde otros ven sequía, él siente silencio. Su poder nunca es estable. Fluctúa con la luna, se agita con la tormenta y se debilita cuando el mundo le es hostil. Derrotar a un mago de agua no es cuestión de fuerza, sino de elegir bien el lugar y el momento.',
                    passive: 'El poder del Mago de Agua depende del contexto ambiental, acumulando tanto bonificaciones como penalizaciones.\n\nSegún la fase lunar: Con luna llena obtiene un aumento significativo de maná y regeneración. Con luna nueva su maná se reduce y el coste de sus habilidades aumenta.\n\nSegún el clima: Con lluvia aumenta su velocidad y la eficacia de su magia. Durante tormentas alcanza su máximo potencial ofensivo.\n\nSegún el bioma: En océanos, ríos y costas regenera vida de forma constante. En pantanos y junglas la regeneración es moderada, con efectos secundarios. En biomas fríos obtiene mayor defensa y control. En desiertos y badlands sufre regeneración negativa y penalización mágica. En el Nether recibe penalizaciones acumulativas severas.\n\nEstado mojado: Aumenta su resistencia al fuego. Aumenta su vulnerabilidad a efectos eléctricos.\n\nTodos los modificadores se acumulan, tanto positivos como negativos.',
                    active: 'El Mago de Agua puede realizar acciones especiales ligadas al agua y a sus estados. Puede respirar bajo el agua y desplazarse en ella a gran velocidad. Durante tormentas puede ejecutar un impulso acuático direccional con cualquier arma, similar a una acometida hidrodinámica.\n\nEl agua embotellada adquiere propiedades especiales según su origen, pudiendo curar, apoyar aliados o aplicar efectos situacionales.\n\nSolo él puede capturar fauna acuática en cubetas, convirtiendo acuarios y colecciones en un valor económico y narrativo. Al completar todas las especies acuáticas en un macro-acuario se activa el Ritual del Agua Pura, que otorga acceso a una Fuente de la Juventud: un bloque de agua único y no transportable que elimina todos los efectos negativos, otorga vida extra temporal y actúa como lugar sagrado y punto de poder.\n\nEn el Nether, el agua se vuelve hostil y todos los beneficios se invierten.',
                    note: 'La magia del agua no perdona la arrogancia. El Mago de Agua es invencible solo cuando el mundo lo acompaña, y vulnerable cuando insiste en luchar contra la marea. Su mayor fortaleza no es el poder, sino la comprensión profunda de que el entorno también juega. La magia es visualización, es imaginación. ¿Te ves a ti mismo venciendo a un mago de agua bajo una lluvia torrencial, en medio del océano?'
                },
                en: {
                    title: 'THE WATER MAGICIAN',
                    type: 'Faction Role - Fantasy',
                    rarity: 'Unique',
                    persistence: 'Permanent',
                    alignment: 'Elemental Sorcerer',
                    description: 'The Water Magician does not control water: he interprets it. His magic is not born from brute force or rigid study, but from absolute visualization of his surroundings. To him, the world is not a stage, but a constant flow of tides, lunar cycles, and shifting climates. Where others see rain, he sees opportunity; where others see drought, he feels silence. His power is never stable. It fluctuates with the moon, surges with the storm, and weakens when the world turns hostile. Defeating a Water Magician is not a matter of strength, but of choosing the right place and the right moment.',
                    passive: 'The Water Magician\'s power depends on environmental context, accumulating both bonuses and penalties.\n\nAccording to the lunar phase: During a full moon, he gains a significant increase in mana and regeneration. During a new moon, his mana is reduced and ability costs increase.\n\nAccording to the weather: Rain increases movement speed and magical efficiency. Storms grant maximum offensive potential.\n\nAccording to the biome: Oceans, rivers, and coastlines provide constant health regeneration. Swamps and jungles offer moderate regeneration with secondary effects. Cold biomes grant increased defense and control. Deserts and badlands cause negative regeneration and magical penalties. The Nether applies severe cumulative penalties.\n\nWet status: Increased resistance to fire. Increased vulnerability to electrical effects.\n\nAll modifiers stack, both positive and negative.',
                    active: 'The Water Magician can perform special actions tied to water and its states. He can breathe underwater and move through it at high speed. During storms, he can execute a directional aquatic burst with any weapon, similar to a hydrodynamic charge.\n\nBottled water gains special properties depending on its origin, allowing it to heal, support allies, or apply situational effects.\n\nOnly he can capture aquatic fauna in buckets, turning aquariums and collections into economic and narrative value. Completing all aquatic species in a macro-aquarium activates the Ritual of Pure Water, granting access to a Fountain of Youth: a unique, non-transportable water block that removes all negative effects, grants temporary extra life, and functions as a sacred site and power focus.\n\nIn the Nether, water becomes hostile and all benefits are reversed.',
                    note: 'Water magic does not forgive arrogance. The Water Magician is invincible only when the world supports him, and vulnerable when he insists on fighting against the tide. His greatest strength is not power, but the deep understanding that the environment also plays a role. Magic is visualization, it is imagination. Can you see yourself defeating a Water Magician under torrential rain, in the middle of the ocean?'
                }
            },
            {
                id: 'chained_hero',
                icon: '⚔️',
                image: 'HeroeEncadenado.jpeg',
                faction: 'fantasy',
                es: {
                    title: 'EL HÉROE ENCADENADO',
                    type: 'Rol Único - Fantasía',
                    rarity: 'Única',
                    persistence: 'Permanente',
                    alignment: 'Tragedia / Gloria Marchita',
                    description: 'Hubo un tiempo en que su nombre inspiraba canciones. Ahora, solo queda el eco. El Héroe Encadenado no murió… pero tampoco vive. Camina como un recuerdo, atado a juramentos que nadie más conserva. Su espada bebe almas, su armadura finge grandeza, y su cuerpo pertenece más a la tumba que al mundo. Quiere ser un héroe una vez más. Pero cada vez que lo intenta, algo se oxida.',
                    passive: 'NATURALEZA NO-MUERTA: El Héroe Encadenado existe en un estado entre la vida y la muerte. Las pociones de curación lo dañan. Las pociones de daño lo curan. Los no-muertos comunes (zombis y similares) no lo atacan. No puede dormir. Puede caminar libremente sobre arena de almas. El sol lo debilita ligeramente (regeneración reducida / fatiga leve). La noche lo fortalece ligeramente (velocidad o resistencia menor). Perros, conejos y phantoms lo odian a muerte.\n\nANTIFRÁGIL: Recibe daño ligeramente reducido por caídas, venenos y efectos ambientales. El dolor ya no lo impresiona.\n\nAFINIDAD ESPIRITUAL: Interactúa de forma más efectiva con objetos ligados a almas, espíritus y rituales (artefactos del alma, invocaciones, reliquias y similares).',
                    active: 'SOULCALIBUR - ESPADA VINCULADA: Solo él puede liberar su verdadero poder. Las muertes almacenan Almas (máx. 5). Puede invocar espíritus aliados basados en las almas almacenadas. Las almas pueden consumirse para aumentar temporalmente el daño o la resistencia. Golpear repetidamente al mismo objetivo marca su Eco, otorgando pequeños bonos situacionales contra ese jugador por un tiempo.\n\nARMADURA DEL HÉROE PENITENTE: Al equiparla otorga daño y resistencia muy aumentados, presencia imponente y bonos de combate notables. Sin embargo, acumula Óxido con el tiempo que reduce progresivamente las estadísticas. Si se lleva demasiado tiempo → debuffs severos. La armadura debe quitarse para "descansar", entrando en un período de enfriamiento. Cuanto más intenta ser un héroe… más pesado se vuelve el pasado.\n\nVOTOS VINCULANTES: Puede jurar juramentos personales o contratos con otros jugadores (proteger a alguien, cazar un objetivo, servicio temporal, completar una misión específica, sacrificar algo a cambio de otra cosa). Si el voto se cumple → bendiciones temporales o almas adicionales. Si se rompe → penalizaciones narrativas o debuffs.\n\nESCLAVO DEL LLAMADO: Puede aceptar una orden directa de otro jugador si posee un objeto especial. No puede negarse. Con su espada de más allá de este mundo, puede cortar un concepto mismo (un oficio, un objeto, un estado del ser). Solo puede existir una orden a la vez, y solo temporalmente. Mientras cumple la orden → gana mejoras notables. Cuando termina → puede exigir un favor equivalente a cambio. Nadie lo comanda gratis.',
                    note: '"Aplausos que nadie recuerda. Promesas que aún pesan." Dicen que en las noches sin luna se puede oír metal raspando contra piedra. No es un monstruo. No es un salvador. Es un héroe cuyo nombre olvidó el tiempo. Pero él recuerda su historia claramente… y aunque solo queden cenizas, perdurará. Porque aunque su cuerpo cayó, su alma es más implacable que cualquier bendición, que cualquier maldición.'
                },
                en: {
                    title: 'THE CHAINED HERO',
                    type: 'Unique Role - Fantasy',
                    rarity: 'Unique',
                    persistence: 'Permanent',
                    alignment: 'Tragedy / Tarnished Glory',
                    description: 'There was a time when his name inspired songs. Now, only the echo remains. The Chained Hero did not die… but neither does he truly live. He walks like a memory, bound to oaths no one else still keeps. His sword drinks souls, his armor pretends at greatness, and his body belongs more to the grave than to the world. He wants to be a hero once again. But every time he tries, something rusts.',
                    passive: 'UNDEAD NATURE: The Chained Hero exists in a state between life and death. Healing potions harm him. Damage potions heal him. Common undead (zombies and similar) do not attack him. He cannot sleep. He can walk freely across soul sand. The sun weakens him slightly (reduced regeneration / mild fatigue). The night strengthens him slightly (minor speed or resistance). Dogs, rabbits, and phantoms despise him on sight.\n\nANTIFRAGILE: He takes slightly reduced damage from falls, poisons, and environmental effects. Pain no longer impresses him.\n\nSPIRITUAL AFFINITY: He interacts more effectively with objects bound to souls, spirits, and rituals (soul artifacts, summons, relics, and similar items).',
                    active: 'SOULCALIBUR - BOUND BLADE: Only he can draw out its true power. Kills store Souls (max. 5). He may summon allied spirits based on stored souls. Souls may be consumed to temporarily boost damage or resistance. Repeatedly striking the same target marks its Echo, granting small situational bonuses against that player for a time.\n\nARMOR OF THE PENITENT HERO: When equipped, greatly increased damage and resistance, an imposing presence, and notable combat bonuses. However, it accumulates Rust over time that progressively reduces stats. If worn too long → severe debuffs. The armor must be removed to "rest," entering a cooldown period. The more he tries to be a hero… the heavier the past becomes.\n\nBINDING VOWS: He may swear personal oaths or contracts involving other players (protecting someone, hunting a target, temporary service, completing a specific mission, sacrificing something in exchange for something else). If the vow is fulfilled → temporary blessings or additional souls. If it is broken → narrative penalties or debuffs.\n\nSLAVE TO THE CALLING: He may accept a direct command from another player if they possess a special item. He cannot refuse. With his blade from beyond this world, he may cut a concept itself (a craft, an object, a state of being). Only one such command may exist at a time, and only temporarily. While fulfilling the order → he gains notable enhancements. When it ends → he may demand an equivalent favor in return. No one commands him for free.',
                    note: '"Applause no one remembers. Promises that still weigh." They say that on moonless nights, metal can be heard scraping across stone. He is not a monster. He is not a savior. He is a hero whose name time forgot. But he remembers his story clearly… and even if only ashes remain, he will endure. For though his body fell, his soul is more relentless than any blessing, than any curse.'
                }
            },
            {
                id: 'vestige_gaia',
                icon: '🌋',
                image: 'VestigioDeGaia.jpeg',
                faction: 'fantasy',
                es: {
                    title: 'VESTIGIO DE GAIA',
                    type: 'Rol Único - Fantasía',
                    rarity: 'Única',
                    persistence: 'Permanente',
                    alignment: 'Caos Telúrico / Voluntad Primordial',
                    description: 'El Vestigio de Gaia es un fragmento incompleto de una entidad elemental que, en otro tiempo, fue totalidad. Cuando el mundo se quebró, la tierra despertó… rota, dispersa, consciente a medias. No piensa como los mortales. No obedece leyes mágicas ni pactos arcanos. Su poder emerge de forma espontánea: a veces salvador, a veces devastador, siempre impredecible. Allí donde otros buscan control, el Vestigio acepta la inestabilidad como verdad absoluta.',
                    passive: 'FRAGMENTACIÓN CONSCIENTE: El Vestigio de Gaia manifiesta un estado de inestabilidad telúrica permanente. Sus habilidades se activan mediante probabilidades variables, que pueden cambiar con el tiempo y la situación. Puede, de forma impredecible: ignorar por completo ciertos golpes físicos, infligir impactos devastadores sin previo aviso, obtener beneficios irregulares al minar piedra y minerales, resistir empujes y daño al permanecer completamente inmóvil, reaccionar sísmicamente al recibir grandes cantidades de daño. La tierra decide. El Vestigio solo existe dentro de esa decisión.\n\nDEBILIDAD PERMANENTE - FRAGMENTO INCOMPLETO: El Vestigio no está entero. Su esencia carece de cohesión total. Esto provoca que algunos efectos se anulen entre sí, los picos de poder vengan acompañados de largos silencios, y su resistencia fluctúe sin aviso previo. No se rompe fácilmente… pero nunca está verdaderamente estable.\n\nMALDICIÓN - RELACIÓN ERRÁTICA CON EL AGUA: El agua no siempre lo reconoce como tierra. En ocasiones se hunde y camina bajo el agua como si fuera roca sólida. En otras pierde toda estabilidad y es incapaz de nadar correctamente. Cruzar ríos, cuevas inundadas o caer al océano puede ser trivial… o una sentencia, dependiendo del humor del mundo en ese momento.',
                    active: 'LIMITACIÓN - VOLUNTAD INESTABLE: El poder del Vestigio no puede forzarse. Las habilidades nunca se activan por elección directa. Intentar controlar a Gaia es inútil: a veces responde con fuerza abrumadora, a veces permanece inerte, como una roca muerta. "Quien exige a la tierra, acaba enterrado." — Grabado en una losa sin nombre.',
                    note: '"La tierra no habla… responde." Dicen que Gaia murió. Otros afirman que simplemente se rompió. El Vestigio no confirma ni niega nada. Permanece inmóvil… y deja que el mundo decida si hoy recuerda quién fue.'
                },
                en: {
                    title: 'VESTIGE OF GAIA',
                    type: 'Unique Role - Fantasy',
                    rarity: 'Unique',
                    persistence: 'Permanent',
                    alignment: 'Telluric Chaos / Primordial Will',
                    description: 'The Vestige of Gaia is an incomplete fragment of an elemental entity that was once whole. When the world shattered, the land awakened—broken, scattered, half-aware. It does not think like mortals. It does not obey magical laws or arcane pacts. Its power emerges spontaneously: sometimes salvific, sometimes devastating, always unpredictable. Where others seek control, the Vestige accepts instability as absolute truth.',
                    passive: 'CONSCIOUS FRAGMENTATION: The Vestige of Gaia exists in a state of permanent telluric instability. Its abilities activate through variable probabilities, which may shift over time and circumstance. It may, unpredictably: completely ignore certain physical attacks, deal devastating blows without warning, gain irregular benefits when mining stone and minerals, resist knockback and damage while remaining perfectly still, trigger seismic reactions when taking large amounts of damage. The earth decides. The Vestige merely exists within that decision.\n\nPERMANENT WEAKNESS - INCOMPLETE FRAGMENT: The Vestige is not whole. Its essence lacks total cohesion. As a result: certain effects may cancel one another, power surges are followed by long periods of silence, its resilience fluctuates without warning. It does not break easily… but it is never truly stable.\n\nCURSE - ERRATIC BOND WITH WATER: Water does not always recognize it as land. At times it sinks and walks beneath the surface as if on solid ground. At others it loses all stability and cannot swim at all. Crossing rivers, flooded caves, or falling into the ocean may be trivial… or a death sentence, depending on the world\'s mood that day.',
                    active: 'LIMITATION - UNYIELDING WILL: The Vestige\'s power cannot be forced. Abilities never activate by direct choice. Attempting to command Gaia is futile: sometimes she answers with overwhelming force, sometimes she remains inert, like dead stone. "He who demands from the earth ends up buried by it." — Inscription on an unnamed slab.',
                    note: '"The earth does not speak… it answers." Some say Gaia died. Others claim she merely shattered. The Vestige neither confirms nor denies. It remains still… and lets the world decide whether today it remembers what she once was.'

        function getFilteredCards() {
            if (currentFilter === 'all') return cards;
            return cards.filter(card => card.faction === currentFilter);
        }

        function updateFilterButtons() {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                const filter = btn.getAttribute('data-filter');
                btn.textContent = translations[currentLang].filters[filter];
            });
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            const filteredCards = getFilteredCards();
            grid.innerHTML = '';

            if (filteredCards.length === 0) {
                grid.innerHTML = `<div class="no-results">${translations[currentLang].noResults}</div>`;
                return;
            }

            filteredCards.forEach(card => {
                const data = card[currentLang];
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.onclick = () => openModal(card);

                cardEl.innerHTML = `
                    <div class="card-image" style="${card.image ? `background-image: url(${card.image})` : ''}">${card.image ? '' : card.icon}</div>
                    <h3 class="card-title">${data.title}</h3>
                    <p class="card-type">${data.type}</p>
                    <p class="card-rarity">⭐ ${data.rarity}</p>
                `;

                grid.appendChild(cardEl);
            });
        }

        function openModal(card) {
            const data = card[currentLang];
            document.getElementById('modalTitle').textContent = data.title;

            const meta = document.getElementById('modalMeta');
            meta.innerHTML = `
                <div class="meta-item">📌 ${data.type}</div>
                <div class="meta-item">⭐ ${data.rarity}</div>
                <div class="meta-item">🔄 ${data.persistence}</div>
                <div class="meta-item">⚔️ ${data.alignment}</div>
            `;

            const body = document.getElementById('modalBody');
            body.innerHTML = `
                <div class="modal-section">
                    <h3 class="section-title">${currentLang === 'es' ? 'Descripción' : 'Description'}</h3>
                    <div class="section-content">${data.description}</div>
                </div>
                <div class="modal-section">
                    <h3 class="section-title">${currentLang === 'es' ? 'Efecto Pasivo' : 'Passive Effect'}</h3>
                    <div class="section-content">${data.passive}</div>
                </div>
                <div class="modal-section">
                    <h3 class="section-title">${currentLang === 'es' ? 'Efecto Activo' : 'Active Effect'}</h3>
                    <div class="section-content">${data.active}</div>
                </div>
                <div class="modal-section">
                    <h3 class="section-title">${currentLang === 'es' ? 'Nota Narrativa' : 'Narrative Note'} 📕</h3>
                    <div class="section-content">${data.note}</div>
                </div>
            `;

            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            updateFilterButtons();
            renderCards();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            renderCards();
        }

        document.getElementById('modal').onclick = (e) => {
            if (e.target.id === 'modal') closeModal();
        };

        updateFilterButtons();
        renderCards();
    </script>
